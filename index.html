<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1319">
<title>定量降水預報 · 指定地點</title>
<meta name="apple-mobile-web-app-title" content="降水點位">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header>
    <form id="locForm">
      <div class="field">
        <input id="locInput" type="text" inputmode="text" autocomplete="off"
               placeholder="搜尋地名，或貼網址／座標">
        <button id="clearInput" type="button" aria-label="清除" hidden>✕</button>
      </div>
      <button type="submit">定位</button>
    </form>
    <div id="favs" hidden></div>
    <p id="locStatus"></p>
    <p id="rain" hidden></p>
    <ul id="results" hidden></ul>
  </header>

  <div id="timestamp" class="crop" hidden><img alt="發布時間與有效時間"></div>

  <main id="stage">
    <div id="viewport">
      <img id="map" alt="定量降水預報圖">
      <div id="pin" hidden><span></span></div>
      <div id="overlayMsg" hidden></div>
    </div>
    <aside id="legendPane" hidden>
      <div id="legend" class="crop"><img alt="降水量色階"></div>
      <p>毫米</p>
    </aside>
  </main>

  <nav id="frames"></nav>

  <footer>
    <button id="resetView" type="button">全台</button>
    <span><a href="https://www.cwa.gov.tw/V8/C/P/QPF.html" target="_blank" rel="noopener">中央氣象署</a>
    · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></span>
    <a class="help" href="https://github.com/Ben901227/rain-predit#%E6%93%8D%E4%BD%9C%E8%AA%AA%E6%98%8E"
       target="_blank" rel="noopener">操作說明</a>
    <a class="repo" href="https://github.com/Ben901227/rain-predit"
       target="_blank" rel="noopener" aria-label="原始碼" title="原始碼">
      <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                 -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
                 .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
                 -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
                 .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
                 .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
                 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
  </footer>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
