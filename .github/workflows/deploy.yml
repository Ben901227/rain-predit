name: Deploy

# 網頁本身是靜態檔，但雨量網格必須定期由 CWA 的預報圖重新解析，
# 所以改用 Actions 部署：每次執行都重新產生 rain/，不進版控。
#
# 刻意「沒有」schedule 觸發：GitHub 會在公開 repo 閒置 60 天後自動停用
# 帶有 schedule 的 workflow，而停用後連 workflow_dispatch 都會被拒
# （實測回 HTTP 422），等於整條資料管線靜默停擺。
# 定時的部分交給外部的 Google Apps Script，它每 30 分鐘檢查 CWA 的
# Last-Modified，真的換版才呼叫 workflow_dispatch。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 排在最前面：測試沒過就不該浪費時間去抓 12 張圖，也不該部署。
      # 這個 step 失敗 → build 失敗 → deploy（needs: build）不會執行。
      - name: 跑測試
        run: node --test test/*.test.js

      - name: 解析預報圖成雨量網格
        run: python3 rain_grid.py _site/rain

      - name: 組出網站內容
        run: |
          cp index.html app.js qpf.js style.css manifest.json _site/
          cp favicon.svg apple-touch-icon.png icon-192.png icon-512.png _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
